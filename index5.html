<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preparación | RecycleNow Lima</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <div class="contenedor">
      <h1>RecycleNow Lima</h1>
      <nav aria-label="Navegación principal">
        <form action="index4.html"><button type="submit">Identifica</button></form>
        <form action="index3.html"><button type="submit">Botella</button></form>
        <form action="index5.html"><button type="submit">Preparación</button></form>
        <form action="index.html"><button type="submit">Puntos de acopio</button></form>
        <form action="index2.html"><button type="submit">Detalle del punto</button></form>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <div class="columnas">
      <div>
        <h2>Prepara tu botella PET</h2>
        <p>Sigue los 4 pasos en orden obligatorio. <strong>Debes completar cada paso para desbloquear el siguiente:</strong></p>

        <!-- Barra de progreso -->
        <div class="barra-progreso" aria-label="Progreso de preparación">
          <div id="progreso-relleno" class="progreso-relleno"></div>
        </div>
        <div class="progreso-info">
          <span>Progreso del protocolo:</span>
          <span id="progreso-porcentaje">0%</span>
        </div>

        <div id="progreso-mensaje" class="mensaje-progreso pendiente">
          Debes completar los pasos en orden. Paso actual habilitado: 1 de 4.
        </div>

        <!-- Checklist en Cascada -->
        <div id="checklist-preparacion" class="caja" style="margin-top: 10px;">
          <label class="paso-item paso-habilitado">
            <input type="checkbox" class="check-paso" id="paso-1"> 
            <strong>Paso 1:</strong> Vacía la botella por completo.
          </label>
          <label class="paso-item paso-bloqueado">
            <input type="checkbox" class="check-paso" id="paso-2" disabled> 
            <strong>Paso 2:</strong> Enjuágala si tiene restos o azúcares.
          </label>
          <label class="paso-item paso-bloqueado">
            <input type="checkbox" class="check-paso" id="paso-3" disabled> 
            <strong>Paso 3:</strong> Separa la tapa y la etiqueta según las indicaciones locales.
          </label>
          <label class="paso-item paso-bloqueado">
            <input type="checkbox" class="check-paso" id="paso-4" disabled> 
            <strong>Paso 4:</strong> Compacta la botella reduciendo su volumen.
          </label>
        </div>

        <!-- Botón condicional -->
        <button type="button" id="btn-buscar-acopio" class="btn-accion-checklist" disabled style="width: 100%; margin-top: 15px; padding: 12px;">
          Consultar puntos de acopio
        </button>
      </div>

      <div>
        <img src="imagenes/botella-pet.webp" alt="Botella de plástico lista para reciclaje">
      </div>
    </div>
  </main>

  <footer>
    <div class="contenedor">
      <p>RecycleNow Lima · Proyecto académico</p>
    </div>
  </footer>
</body>

</html>
